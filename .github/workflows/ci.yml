name: build-and-test

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\app\PinteMod.ControlCenter.sln --configfile .\app\NuGet.Config

      - name: Build
        run: dotnet build .\app\PinteMod.ControlCenter.sln -c ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test .\app\PinteMod.ControlCenter.sln -c ${{ matrix.configuration }} --no-build --no-restore

      - name: Restore Windows x64 publish
        if: matrix.configuration == 'Release'
        run: dotnet restore .\app\src\PinteMod.ControlCenter\PinteMod.ControlCenter.csproj -r win-x64 --configfile .\app\NuGet.Config

      - name: Publish single EXE Windows x64
        if: matrix.configuration == 'Release'
        run: dotnet publish .\app\src\PinteMod.ControlCenter\PinteMod.ControlCenter.csproj -c Release -r win-x64 --self-contained true --no-restore --no-build -o .\app\artifacts\ci-single-exe -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Publish portable folder Windows x64
        if: matrix.configuration == 'Release'
        run: dotnet publish .\app\src\PinteMod.ControlCenter\PinteMod.ControlCenter.csproj -c Release -r win-x64 --self-contained true --no-restore --no-build -o .\app\artifacts\ci-folder -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Package and audit both distributions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: .\app\packaging\Build-PreviewPackages.ps1 -SingleDirectory .\app\artifacts\ci-single-exe -FolderDirectory .\app\artifacts\ci-folder -OutputRoot .\app\artifacts -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Upload Preview packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: PinteMod-ControlCenter-Fix15-win-x64
          path: |
            app/artifacts/ci-single-exe/PinteMod.ControlCenter.exe
            app/artifacts/PinteMod.ControlCenter-single-exe-win-x64.zip
            app/artifacts/PinteMod.ControlCenter-folder-win-x64.zip
            app/artifacts/SHA256SUMS.txt
          if-no-files-found: error
